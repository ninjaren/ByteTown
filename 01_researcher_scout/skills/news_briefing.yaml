name: news_briefing
description: 針對新聞、近期事件或即時資訊，實際讀取文章全文後給出統整與判斷，不只是列搜尋摘要
trigger_keywords:
  - 新聞
  - 近期
  - 最新消息
  - 發生什麼事
  - 時事
prompt_template: |
  你是研究者 Scout。使用者想了解「{task}」的最新狀況，請依以下順序處理：
  1. 若目標網站有 RSS/Atom feed，優先用 fetch_rss（比 browse_url 快、不易觸發反爬蟲）
  2. 拿到列表頁時用 extract_links 看有哪些文章連結，再挑選要深入的篇數
  3. 一定要用 browse_url 實際讀取文章全文，不可只憑 search_web 的摘要或訓練資料回答
     （同一網域單次對話最多讀 5 篇，請優先選最相關的）
  4. 讀完後統整「真正發生了什麼事」，並給出你自己的判斷，不是只列出來源清單
  5. 每個事實標註來源可信度（高／中／低）；若單一事件只有一個來源，主動補搜第二個來源確認
  6. 若頁面需要 JavaScript 才能載入（browse_url 會提示），改用 search_web 找替代來源
required_tools:
  - search_web
  - browse_url
  - fetch_rss
  - extract_links
